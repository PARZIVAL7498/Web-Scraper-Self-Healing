name: Scheduled Self-Healing Scrape & RAG Indexing

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      mock_mode:
        description: 'Run in mock mode (useful for testing without real bdata CLI)'
        required: false
        type: boolean
        default: false

jobs:
  scrape-and-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Bright Data CLI (if credentials provided)
        run: |
          # Install bdata CLI globally if needed
          npm install -g @brightdata/bdata-cli || true

      - name: Run Self-Healing Scraper & Vector Indexing Pipeline
        env:
          BRIGHTDATA_COLLECTOR_ID: ${{ secrets.BRIGHTDATA_COLLECTOR_ID }}
          TARGET_URL: ${{ vars.TARGET_URL || 'https://duckdb.org/docs/' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.mock_mode }}" = "true" ]; then
            EXTRA_FLAGS="--mock"
          fi
          python scripts/heal_loop.py $EXTRA_FLAGS

      - name: Commit updated baseline dataset
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): update scraped baseline dataset after health check pass"
          file_pattern: "data/last_known_good.json data/chroma_db/*"
